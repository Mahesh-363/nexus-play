worker_processes auto;
events { worker_connections 1024; }
http {
  upstream api         { server api:8000; }
  upstream matchmaking { ip_hash; server matchmaking:8001; }
  upstream chat        { ip_hash; server chat:8002; }
  upstream analytics   { server analytics:8003; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;

    location /api/             { proxy_pass http://api/; }
    location /analytics/       { proxy_pass http://analytics/; }

    location /ws/matchmaking {
      proxy_pass http://matchmaking;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
    location /ws/chat {
      proxy_pass http://chat;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }
}
